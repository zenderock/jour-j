# Added by Sokial.
#
# This workflow builds your Android app and hands the result to Sokial, which
# turns it into an installable link for your team.
#
# It stores no Sokial credential: the upload step proves who it is with the
# identity GitHub issues to this run. Where a build is signed, it is signed with
# your own key, read from your own repository secrets — Sokial never receives it.
#
# Each build configuration below is a separate job. Sokial starts one by name;
# what that name builds is decided here, in a file you reviewed.
name: Sokial build

# The token identifies a build Sokial started. It travels in the run name so the
# run can still be matched if the job fails before the upload step.
run-name: Sokial ${{ inputs.sokial_config || 'build' }} ${{ inputs.sokial_token && format('[{0}]', inputs.sokial_token) || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      sokial_token:
        description: Correlation token, set by Sokial when it starts a build
        required: false
        type: string
      sokial_config:
        description: "Which configuration to build: android-debug"
        required: false
        type: string
  push:
    branches: [main]
  # Pull request builds are turned off in this project's Sokial settings.

# Only the newest run per ref and configuration matters — an older one is
# building code nobody is waiting for any more. The configuration is part of the
# group so that starting a release build does not cancel a preview of the same
# branch.
concurrency:
  group: sokial-${{ github.workflow }}-${{ github.ref }}-${{ inputs.sokial_config }}
  cancel-in-progress: true

permissions:
  # Requests the OIDC token the upload step authenticates with.
  id-token: write
  contents: read

jobs:
  configuration:
    name: Sokial configuration check
    runs-on: ubuntu-latest
    steps:
      - name: Check the requested configuration is one this file defines
        env:
          REQUESTED: ${{ inputs.sokial_config }}
        run: |
          case "${REQUESTED:-}" in
            ''|'android-debug') ;;
            *)
              echo "::error::Sokial asked for the build configuration '$REQUESTED', which this workflow does not define. Sokial opens a pull request whenever a configuration is added or changed — merge it, then run the build again."
              exit 1
              ;;
          esac

  android-debug:
    name: "Android Release"
    needs: configuration
    if: ${{ inputs.sokial_config == '' || inputs.sokial_config == 'android-debug' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm ci

      # A signing key minted for this run and destroyed with it.
      #
      # It is NOT your application's identity. Every build gets a different one,
      # so Android will refuse to install one of these over another — uninstall
      # first — and anything registered against a certificate fingerprint
      # (Google Sign-In, Maps, Firebase, Play Integrity, verified app links)
      # will not work in these builds. Use your own keystore for anything that
      # leaves a test device.
      - name: Mint a throwaway signing key
        run: |
          set -euo pipefail

          # Drawn here rather than written into this file. A literal password in
          # a committed workflow is what a secret scanner is for, and one that
          # fires on a file Sokial opened is a false positive somebody still has
          # to triage — and a reason to trust the next alert less.
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"

          keytool -genkeypair -noprompt -storetype PKCS12 -alias sokial \
            -keystore "$RUNNER_TEMP/sokial-release.keystore" \
            -storepass "$password" -keypass "$password" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Sokial test build, OU=Not for distribution, O=Sokial"

          # Carried to the build step through the environment, so it never
          # appears in a command line the process table can be read for.
          {
            echo "SOKIAL_STORE_PASSWORD=$password"
            echo "SOKIAL_KEY_PASSWORD=$password"
            echo "SOKIAL_KEY_ALIAS=sokial"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/sokial-release.keystore" \
            -Pandroid.injected.signing.store.password="$SOKIAL_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SOKIAL_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SOKIAL_KEY_PASSWORD"

      - name: Verify the package is signed
        env:
          ARTIFACT: android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail
          # apksigner ships with the Android build tools already on the runner.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$ARTIFACT"

      - name: Upload to Sokial
        env:
          SOKIAL_API: https://api.sokial.app
          SOKIAL_TOKEN: ${{ inputs.sokial_token }}
          SOKIAL_CONFIG: android-debug
          ARTIFACT: android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail

          if [ ! -f "$ARTIFACT" ]; then
            echo "::error::The build finished but $ARTIFACT is not there. Sokial expects the path Gradle writes by default; if this project puts it somewhere else, change ARTIFACT above."
            echo "Packages this run did produce:"
            find . \( -name '*.apk' -o -name '*.aab' \) -print || true
            exit 1
          fi

          # The identity of this run, issued by GitHub and verifiable by Sokial.
          # Nothing here is a secret you had to create.
          idurl="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sokial"
          idauth="Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          oidc=$(curl -sS -H "$idauth" "$idurl" | jq -r .value)

          size=$(stat -c%s "$ARTIFACT")
          checksum=$(sha256sum "$ARTIFACT" | cut -d" " -f1)

          auth="Authorization: Bearer $oidc"
          json="Content-Type: application/json"

          # Sokial signs a destination; the package then goes straight to
          # storage. Nothing this large is worth proxying through an API.
          body="{\"kind\":\"apk\",\"sizeBytes\":$size,\"configuration\":\"$SOKIAL_CONFIG\"}"
          upload=$(curl -sS --fail-with-body -X POST "$SOKIAL_API/v1/uploads" -H "$auth" -H "$json" -d "$body")

          id=$(printf '%s' "$upload" | jq -r .uploadId)
          put=$(printf '%s' "$upload" | jq -r .putUrl)

          curl -sS --fail-with-body -X PUT "$put" --upload-file "$ARTIFACT"

          # Only now does the build count as delivered: Sokial confirms the file
          # actually arrived before it publishes anything.
          result="{\"checksum\":\"$checksum\"}"
          curl -sS --fail-with-body -X POST "$SOKIAL_API/v1/uploads/$id/finalize" -H "$auth" -H "$json" -d "$result"


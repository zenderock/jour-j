# Added by Sokial.
#
# This workflow builds your Android app and hands the result to Sokial, which
# turns it into an installable link for your team.
#
# It stores no Sokial credential: the upload step proves who it is with the
# identity GitHub issues to this run. Where a build is signed, it is signed with
# your own key, read from your own repository secrets — Sokial never receives it.
#
# Each build configuration below is a separate job. Sokial starts one by name;
# what that name builds is decided here, in a file you reviewed.
name: Sokial build

# The token identifies a build Sokial started. It travels in the run name so the
# run can still be matched if the job fails before the upload step.
run-name: Sokial ${{ inputs.sokial_config || 'build' }} ${{ inputs.sokial_token && format('[{0}]', inputs.sokial_token) || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      sokial_token:
        description: Correlation token, set by Sokial when it starts a build
        required: false
        type: string
      sokial_config:
        description: "Which configuration to build: android-debug"
        required: false
        type: string
  # Automatic push and pull request builds are turned off in this project's Sokial settings.

# Only the newest run per ref and configuration matters — an older one is
# building code nobody is waiting for any more. The configuration is part of the
# group so that starting a release build does not cancel a preview of the same
# branch.
concurrency:
  group: sokial-${{ github.workflow }}-${{ github.ref }}-${{ inputs.sokial_config }}
  cancel-in-progress: true

permissions:
  # Requests the OIDC token the upload step authenticates with.
  id-token: write
  contents: read

jobs:
  configuration:
    name: Sokial configuration check
    runs-on: ubuntu-latest
    steps:
      - name: Check the requested configuration is one this file defines
        env:
          REQUESTED: ${{ inputs.sokial_config }}
        run: |
          case "${REQUESTED:-}" in
            ''|'android-debug') ;;
            *)
              echo "::error::Sokial asked for the build configuration '$REQUESTED', which this workflow does not define. Sokial opens a pull request whenever a configuration is added or changed — merge it, then run the build again."
              exit 1
              ;;
          esac

  android-debug:
    name: "Android Release"
    needs: configuration
    if: ${{ inputs.sokial_config == '' || inputs.sokial_config == 'android-debug' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm ci

      # A signing key minted for this run and destroyed with it.
      #
      # It is NOT your application's identity. Every build gets a different one,
      # so Android will refuse to install one of these over another — uninstall
      # first — and anything registered against a certificate fingerprint
      # (Google Sign-In, Maps, Firebase, Play Integrity, verified app links)
      # will not work in these builds. Use your own keystore for anything that
      # leaves a test device.
      - name: Mint a throwaway signing key
        run: |
          set -euo pipefail

          # Drawn here rather than written into this file. A literal password in
          # a committed workflow is what a secret scanner is for, and one that
          # fires on a file Sokial opened is a false positive somebody still has
          # to triage — and a reason to trust the next alert less.
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"

          keytool -genkeypair -noprompt -storetype PKCS12 -alias sokial \
            -keystore "$RUNNER_TEMP/sokial-release.keystore" \
            -storepass "$password" -keypass "$password" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Sokial test build, OU=Not for distribution, O=Sokial"

          # Carried to the build step through the environment, so it never
          # appears in a command line the process table can be read for.
          {
            echo "SOKIAL_STORE_PASSWORD=$password"
            echo "SOKIAL_KEY_PASSWORD=$password"
            echo "SOKIAL_KEY_ALIAS=sokial"
          } >> "$GITHUB_ENV"

      # Adds Sokial's tester gate to this build only.
      #
      # This configuration is set to invited testers, so the application asks
      # for an email on first launch and opens for an address on the project's
      # list. Nothing is written into your repository: the file below lives on
      # the runner and is destroyed with it.
      - name: Add the Sokial tester gate
        env:
          SOKIAL_MAVEN: https://maven.sokial.app
          SOKIAL_RUNTIME_VERSION: 0.1.1
          SOKIAL_API: https://api.sokial.app
          SOKIAL_PROJECT: 09e80a7a-af0c-4b49-983b-ad7b2e499dd7
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"

          # Carried to the build step, not just this one.
          #
          # A step's env: block ends with the step. The script written below is
          # read much later, by Gradle, in the step that compiles — and it reads
          # these from the environment. Without this they are absent exactly
          # where they are needed, and the first thing Gradle does with a
          # missing repository URL is fail somebody else's plugin resolution.
          {
            echo "SOKIAL_MAVEN=$SOKIAL_MAVEN"
            echo "SOKIAL_RUNTIME_VERSION=$SOKIAL_RUNTIME_VERSION"
            echo "SOKIAL_API=$SOKIAL_API"
            echo "SOKIAL_PROJECT=$SOKIAL_PROJECT"
          } >> "$GITHUB_ENV"

          # Quoted heredoc: nothing in the script below is expanded by the
          # shell, so a value is substituted once, by Gradle, from the
          # environment — and never spliced into the file as text.
          cat > "$HOME/.gradle/init.d/sokial-runtime.gradle" <<'SOKIAL_INIT'
          def sokialMaven = System.getenv("SOKIAL_MAVEN")
          def sokialVersion = System.getenv("SOKIAL_RUNTIME_VERSION")
          def sokialApi = System.getenv("SOKIAL_API")
          def sokialProject = System.getenv("SOKIAL_PROJECT")

          // Nothing configured, nothing done.
          //
          // An init script applies to included builds as well as the root one —
          // React Native resolves its own Gradle plugin from one — so a missing
          // value must never become uri(null) in the middle of a plugin
          // resolution that has nothing to do with Sokial.
          //
          // A tester-only build must fail closed. Producing an ordinary APK
          // while the workflow says it is protected is worse than stopping the
          // build, because the resulting file can be forwarded as if the gate
          // were present.
          if (!sokialMaven || !sokialVersion || !sokialApi || !sokialProject) {
              throw new GradleException("Sokial: tester gate configuration is incomplete.")
          }

          gradle.settingsEvaluated { settings ->
              def management = settings.dependencyResolutionManagement
              management.repositories {
                  maven {
                      url = uri(sokialMaven)
                      content { includeGroup("app.sokial") }
                  }
              }

              // Where the repository has to be declared depends on the project,
              // and getting it wrong fails two different ways: under
              // FAIL_ON_PROJECT_REPOS a project-level repository is a hard
              // error, and under PREFER_PROJECT a project that declares its own
              // never reads the settings block at all.
              if (management.repositoriesMode.get().name() == "PREFER_PROJECT") {
                  gradle.beforeProject { project ->
                      project.repositories {
                          maven {
                              url = uri(sokialMaven)
                              content { includeGroup("app.sokial") }
                          }
                      }
                  }
              }
          }

          gradle.beforeProject { project ->
              // Only the application module, and only once its plugin is
              // applied. Adding it to every module would put several copies of
              // an auto-starting provider into one package.
              project.plugins.withId("com.android.application") {
                  project.dependencies.add(
                      "implementation",
                      "app.sokial:sokial-runtime:${sokialVersion}",
                  )
                  project.extensions.getByName("android").defaultConfig.manifestPlaceholders.putAll([
                      sokialApi    : sokialApi,
                      sokialProject: sokialProject,
                  ])
              }
          }
          SOKIAL_INIT

      - name: Build
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/sokial-release.keystore" \
            -Pandroid.injected.signing.store.password="$SOKIAL_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SOKIAL_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SOKIAL_KEY_PASSWORD"

      - name: Verify the package is signed
        env:
          ARTIFACT: android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail
          # apksigner ships with the Android build tools already on the runner.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$ARTIFACT"

      - name: Verify the Sokial tester gate
        env:
          SOKIAL_ARTIFACT: "android/app/build/outputs/apk/release/app-release.apk"
          SOKIAL_PROJECT: "09e80a7a-af0c-4b49-983b-ad7b2e499dd7"
        run: |
          set -euo pipefail

          if [[ -z "$SOKIAL_PROJECT" ]]; then
            echo "::error::Sokial cannot verify the tester gate because this workflow has no project id. Update the Sokial workflow and rebuild."
            exit 1
          fi
          if [[ ! -f "$SOKIAL_ARTIFACT" ]]; then
            echo "::error::The APK was not found at $SOKIAL_ARTIFACT, so its tester gate cannot be verified."
            exit 1
          fi

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -d "$sdk/build-tools" ]]; then
            echo "::error::Android build tools are unavailable, so Sokial cannot verify the tester gate."
            exit 1
          fi
          aapt2="$(find "$sdk/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          if [[ -z "$aapt2" ]]; then
            echo "::error::aapt2 is unavailable, so Sokial cannot verify the tester gate."
            exit 1
          fi

          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          "$aapt2" dump xmltree "$SOKIAL_ARTIFACT" --file AndroidManifest.xml > "$manifest"

          if ! grep -Fq "app.sokial.runtime.SokialProvider" "$manifest"; then
            echo "::error::The APK does not contain the Sokial tester gate runtime. Nothing was uploaded."
            exit 1
          fi
          if ! grep -Fq "$SOKIAL_PROJECT" "$manifest"; then
            echo "::error::The APK tester gate is not configured for this Sokial project. Nothing was uploaded."
            exit 1
          fi

          echo "Sokial tester gate verified in the APK."

      - name: Upload to Sokial
        env:
          SOKIAL_API: https://api.sokial.app
          SOKIAL_TOKEN: ${{ inputs.sokial_token }}
          SOKIAL_CONFIG: android-debug
          ARTIFACT: android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail

          if [ ! -f "$ARTIFACT" ]; then
            echo "::error::The build finished but $ARTIFACT is not there. Sokial expects the path Gradle writes by default; if this project puts it somewhere else, change ARTIFACT above."
            echo "Packages this run did produce:"
            find . \( -name '*.apk' -o -name '*.aab' \) -print || true
            exit 1
          fi

          # The identity of this run, issued by GitHub and verifiable by Sokial.
          # Nothing here is a secret you had to create.
          idurl="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sokial"
          idauth="Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          oidc=$(curl -sS -H "$idauth" "$idurl" | jq -r .value)

          size=$(stat -c%s "$ARTIFACT")
          checksum=$(sha256sum "$ARTIFACT" | cut -d" " -f1)

          auth="Authorization: Bearer $oidc"
          json="Content-Type: application/json"

          # Sokial signs a destination; the package then goes straight to
          # storage. Nothing this large is worth proxying through an API.
          # Why the body is echoed on failure.
          #
          # --fail-with-body writes Sokial's answer to stdout and then exits
          # non-zero — but the substitution captures that stdout into a
          # variable, so all the log ever showed was "curl: (22) ... error:
          # 402". The reason is a sentence Sokial wrote to be read here, and it
          # was being swallowed at the last step.
          body="{\"kind\":\"apk\",\"sizeBytes\":$size,\"configuration\":\"$SOKIAL_CONFIG\"}"
          upload=$(curl -sS --fail-with-body -X POST "$SOKIAL_API/v1/uploads" -H "$auth" -H "$json" -d "$body") || {
            echo "::error::Sokial refused this upload. $(printf '%s' "$upload" | jq -r '.message // .' 2>/dev/null || printf '%s' "$upload")"
            exit 1
          }

          id=$(printf '%s' "$upload" | jq -r .uploadId)
          put=$(printf '%s' "$upload" | jq -r .putUrl)

          if ! stored=$(curl -sS --fail-with-body -X PUT "$put" --upload-file "$ARTIFACT"); then
            echo "::error::The package could not be stored. $stored"
            exit 1
          fi

          # Only now does the build count as delivered: Sokial confirms the file
          # actually arrived before it publishes anything.
          result="{\"checksum\":\"$checksum\"}"
          finalize=$(curl -sS --fail-with-body -X POST "$SOKIAL_API/v1/uploads/$id/finalize" -H "$auth" -H "$json" -d "$result") || {
            echo "::error::Sokial could not accept the finished upload. $(printf '%s' "$finalize" | jq -r '.message // .' 2>/dev/null || printf '%s' "$finalize")"
            exit 1
          }

